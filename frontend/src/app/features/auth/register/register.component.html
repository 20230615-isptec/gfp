<div class="register-container">
  <div class="register-card">
    <h1>FinanSmart</h1>
    <p class="subtitle">Crie sua conta</p>

    <form [formGroup]="form" (ngSubmit)="register()" class="register-form">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input
          id="nome"
          type="text"
          formControlName="nome"
          class="form-input"
          placeholder="Seu nome"
          [class.error]="nome?.invalid && nome?.touched"
        />
        <span class="error-message" *ngIf="nome?.invalid && nome?.touched">
          <span *ngIf="nome?.errors?.['required']">Nome é obrigatório</span>
          <span *ngIf="nome?.errors?.['minlength']">Mínimo 3 caracteres</span>
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-input"
          placeholder="seu@email.com"
          [class.error]="email?.invalid && email?.touched"
        />
        <span class="error-message" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="email?.errors?.['email']">Email inválido</span>
        </span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-input"
          placeholder="••••••••"
          [class.error]="password?.invalid && password?.touched"
        />
        <span class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          class="form-input"
          placeholder="••••••••"
          [class.error]="confirmPassword?.invalid && confirmPassword?.touched"
        />
        <span class="error-message" *ngIf="confirmPassword?.invalid && confirmPassword?.touched">
          <span *ngIf="confirmPassword?.errors?.['required']">Confirme a senha</span>
        </span>
        <span class="error-message" *ngIf="form.errors?.['passwordMismatch'] && confirmPassword?.touched">
          As senhas não coincidem
        </span>
      </div>

      <div class="alert alert-error" *ngIf="hasError">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Registrar</span>
        <span *ngIf="isLoading">Registrando...</span>
      </button>
    </form>

    <div class="form-footer">
      <p>Já tem uma conta? <a href="javascript:void(0)" (click)="goToLogin()">Entrar aqui</a></p>
    </div>
  </div>
</div>
